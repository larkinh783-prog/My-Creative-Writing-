<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#705078"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="My Creative Writing">
<title>My Creative Writing</title>
<style>
:root{--plum:#705078;--plum2:#8d7094;--cream:#fffaf4;--ink:#332d36;--rose:#f4e5e8;--sage:#e6eee5;--blue:#e7edf6;--gold:#f7edcf}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:24px 18px 18px;background:linear-gradient(135deg,#eee3f0,#fff1e6);border-radius:0 0 26px 26px}
h1{font-family:Georgia,serif;font-size:29px;margin:0 0 5px;color:#513c59}h2{font: bold 22px Georgia,serif;margin:8px 0 12px}h3{margin:0 0 5px;font-size:17px}
.sub{color:#685e6c;margin:0}.wrap{max-width:850px;margin:auto;padding-bottom:40px}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px}
nav button,.btn{border:0;border-radius:13px;padding:12px 9px;background:var(--plum);color:white;font-weight:650;font-size:14px}
nav button{background:#fff;color:#55415c;border:1px solid #e4d9e5}
nav button.active{background:var(--plum);color:#fff}
main{padding:0 14px}.panel{background:white;border:1px solid #eee4e7;border-radius:18px;padding:16px;margin:0 0 13px;box-shadow:0 3px 12px #59415b0a}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{padding:15px;border-radius:16px;min-height:112px;border:0;text-align:left;color:var(--ink);font:inherit}
.tile span{display:block;font-size:26px;margin-bottom:6px}.tile b{display:block}.tile small{color:#665d68}
.rose{background:var(--rose)}.sage{background:var(--sage)}.blue{background:var(--blue)}.gold{background:var(--gold)}.lav{background:#eee7f3}
label{display:block;font-weight:650;font-size:13px;margin:12px 0 5px}
input,textarea,select{width:100%;border:1px solid #dcd1dc;border-radius:10px;padding:11px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:110px;resize:vertical}button{cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.row .btn{flex:1}
.btn.secondary{background:#eee7f1;color:#4d3b55}.btn.danger{background:#f7e5e5;color:#8a3030}
.item{padding:12px 0;border-bottom:1px solid #eee7ed}.item:last-child{border:0}.item p{margin:5px 0;color:#6a606d;white-space:pre-wrap;overflow-wrap:anywhere}
.itemhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.tiny{font-size:12px;color:#746977}.empty{color:#766c78;text-align:center;padding:20px 5px}
footer{text-align:center;color:#8a7b8b;font-size:12px;padding:15px}
@media(min-width:650px){nav{grid-template-columns:repeat(6,1fr)}main{padding:0 22px}.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head>
<body><div class="wrap">
<header><h1>✒️ My Creative Writing</h1><p class="sub">Your stories. Your ideas. All in one place.</p></header>
<nav id="nav"></nav><main id="app"></main><footer>Made for your imagination · Remember to export backups regularly.</footer>
</div>
<script>
const KEY='myCreativeWritingData_v1';
const blank=()=>({poems:[],stories:[],ideas:[]});
let data;try{data=JSON.parse(localStorage.getItem(KEY))||blank()}catch(e){data=blank()}
let page='Home', selectedStory=null, editing=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
const pages=['Home','Poetry','Novels','Ideas','Backup'];
function renderNav(){ $('#nav').innerHTML=pages.map(p=>`<button class="${p===page?'active':''}" data-page="${p}">${({Home:'🏡 Home',Poetry:'🪶 Poetry',Novels:'📚 Novels',Ideas:'💡 Ideas',Backup:'💾 Backup'})[p]}</button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.page;selectedStory=null;editing=null;render()})}
function field(label,name,value='',type='text'){return `<label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}">`}
function area(label,name,value='',placeholder=''){return `<label>${label}</label><textarea name="${name}" placeholder="${placeholder}">${esc(value)}</textarea>`}
function btn(label,action,cls='btn'){return `<button type="button" class="${cls}" data-action="${action}">${label}</button>`}
function empty(t){return `<div class="empty">${t}</div>`}
function home(){return `<section class="panel"><h2>Welcome to your writing space</h2><p>Capture a poem, plan a novel, build your characters and keep your ideas safe.</p><div class="cards">
<button class="tile lav" data-page="Poetry"><span>🪶</span><b>Poetry corner</b><small>Write and save poems</small></button>
<button class="tile rose" data-page="Novels"><span>📚</span><b>Novels & stories</b><small>Plan stories and chapters</small></button>
<button class="tile sage" data-page="Ideas"><span>💡</span><b>Ideas notebook</b><small>Keep inspiration handy</small></button>
<button class="tile blue" data-action="new-poem"><span>✍️</span><b>Write something</b><small>Start a new poem</small></button>
<button class="tile gold" data-action="new-story"><span>📖</span><b>Start a story</b><small>Create a writing project</small></button>
<button class="tile lav" data-page="Backup"><span>💾</span><b>Protect your work</b><small>Export or restore a backup</small></button>
</div></section><section class="panel"><h2>Your writing at a glance</h2><div class="cards"><div class="tile rose"><span>🪶</span><b>${data.poems.length} poems</b></div><div class="tile sage"><span>📚</span><b>${data.stories.length} stories</b></div><div class="tile gold"><span>💡</span><b>${data.ideas.length} ideas</b></div></div></section>`}
function poemForm(p={}){return `<section class="panel"><h2>${p.id?'Edit poem':'New poem'}</h2><form id="poemForm"><input type="hidden" name="id" value="${esc(p.id||'')}">${field('Title','title',p.title||'')}${field('Date','date',p.date||new Date().toISOString().slice(0,10),'date')}${area('Your poem','body',p.body||'','Start writing here…')}<div class="row"><button class="btn" type="submit">Save poem</button><button class="btn secondary" type="button" data-action="cancel">Cancel</button></div></form></section>`}
function poems(){return `<section class="panel"><div class="itemhead"><h2>Your poems</h2>${btn('+ New poem','new-poem')}</div>${data.poems.length?data.poems.map(p=>`<div class="item"><div class="itemhead"><div><h3>${esc(p.title||'Untitled poem')}</h3><span class="tiny">${esc(p.date||'')}</span></div><div>${btn('Edit','edit-poem:'+p.id,'btn secondary')}</div></div><p>${esc(p.body||'')}</p>${btn('Delete','delete-poem:'+p.id,'btn danger')}</div>`).join(''):empty('Your poetry starts here. Add your first poem when inspiration strikes.')}</section>`}
function storyList(){return `<section class="panel"><div class="itemhead"><h2>Novels & stories</h2>${btn('+ New story','new-story')}</div>${data.stories.length?data.stories.map(s=>`<div class="item"><div class="itemhead"><div><h3>📚 ${esc(s.title||'Untitled story')}</h3><span class="tiny">${s.chapters.length} chapters · ${s.chapters.reduce((n,c)=>n+(c.body||'').trim().split(/\s+/).filter(Boolean).length,0)} words</span></div>${btn('Open','open-story:'+s.id,'btn secondary')}</div><p>${esc(s.summary||'No summary yet.')}</p><span class="tiny">Started: ${esc(s.started||'—')} · Completed: ${esc(s.completed||'Not yet')}</span></div>`).join(''):empty('Create your first story to start planning your novel.')}</section>`}
function storyForm(s={}){return `<section class="panel"><h2>${s.id?'Edit story details':'Create a story'}</h2><form id="storyForm"><input type="hidden" name="id" value="${esc(s.id||'')}">${field('Story title','title',s.title||'')}${area('Story summary','summary',s.summary||'','What is your story about?')}${field('Date started','started',s.started||new Date().toISOString().slice(0,10),'date')}${field('Date completed','completed',s.completed||'','date')}<div class="row"><button class="btn" type="submit">Save story</button><button class="btn secondary" type="button" data-action="cancel">Cancel</button></div></form></section>`}
function storyDetail(s){return `<section class="panel"><div class="itemhead"><h2>📖 ${esc(s.title)}</h2>${btn('Back to stories','back-stories','btn secondary')}</div><p>${esc(s.summary)}</p><div class="row">${btn('Edit story','edit-story:'+s.id,'btn secondary')}${btn('+ Add character','new-character:'+s.id)}</div></section>
<section class="panel"><h2>Characters (${s.characters.length})</h2>${s.characters.map(c=>`<div class="item"><div class="itemhead"><h3>👤 ${esc(c.name||'Unnamed character')}</h3>${btn('Edit','edit-character:'+s.id+':'+c.id,'btn secondary')}</div><p>${esc(c.personality||'')}${c.age?` · Age ${esc(c.age)}`:''}</p>${btn('Delete','delete-character:'+s.id+':'+c.id,'btn danger')}</div>`).join('')||empty('Add character profiles for your story.')}</section>
<section class="panel"><div class="itemhead"><h2>Chapters (${s.chapters.length})</h2>${btn('+ Add chapter','new-chapter:'+s.id)}</div>${s.chapters.map((c,i)=>`<div class="item"><div class="itemhead"><div><h3>${i+1}. ${esc(c.title||'Untitled chapter')}</h3><span class="tiny">${(c.body||'').trim().split(/\s+/).filter(Boolean).length} words</span></div>${btn('Write / edit','edit-chapter:'+s.id+':'+c.id,'btn secondary')}</div><p>${esc(c.summary||'No summary yet.')}</p></div>`).join('')||empty('Your chapters will appear here.')}${s.chapters.length?btn('Export full story','export-story:'+s.id,'btn'):''}</section>`}
function characterForm(s,c={}){return `<section class="panel"><h2>${c.id?'Edit character':'New character'}</h2><form id="characterForm"><input type="hidden" name="storyId" value="${s.id}"><input type="hidden" name="id" value="${esc(c.id||'')}">${field('Name','name',c.name||'')}${field('Gender','gender',c.gender||'')}${field('Age','age',c.age||'','number')}${field('Mother','mother',c.mother||'')}${field('Father','father',c.father||'')}${field('Siblings','siblings',c.siblings||'')}${field('Hair colour','hair',c.hair||'')}${field('Eye colour','eyes',c.eyes||'')}${area('Personality','personality',c.personality||'')}${area('Interesting notes','notes',c.notes||'')}<div class="row"><button class="btn" type="submit">Save character</button><button class="btn secondary" type="button" data-action="cancel">Cancel</button></div></form></section>`}
function chapterForm(s,c={}){return `<section class="panel"><h2>${c.id?'Edit chapter':'Write a chapter'}</h2><form id="chapterForm"><input type="hidden" name="storyId" value="${s.id}"><input type="hidden" name="id" value="${esc(c.id||'')}">${field('Chapter title','title',c.title||'')}${area('Brief summary','summary',c.summary||'','What happens in this chapter?')}${area('Chapter text','body',c.body||'','Write your chapter here…')}<p class="tiny" id="wordCount">Word count: ${(c.body||'').trim().split(/\s+/).filter(Boolean).length}</p><div class="row"><button class="btn" type="submit">Save chapter</button><button class="btn secondary" type="button" data-action="cancel">Cancel</button></div></form></section>`}
function ideas(){return `<section class="panel"><h2>💡 Ideas notebook</h2><form id="ideaForm">${field('New idea','text','')}${area('Extra notes (optional)','notes','','Add details, dialogue, settings or plot twists…')}<button class="btn" type="submit">Add idea</button></form></section><section class="panel"><h2>Your ideas</h2>${data.ideas.length?data.ideas.map((x,i)=>`<div class="item"><div class="itemhead"><label style="display:flex;gap:8px;align-items:center;margin:0;font-size:16px"><input style="width:auto" type="checkbox" data-used="${x.id}" ${x.used?'checked':''}> <span style="${x.used?'text-decoration:line-through;opacity:.6':''}">${esc(x.text)}</span></label><div>${btn('↑','move-idea:'+i+':-1,'btn secondary')}${btn('↓','move-idea:'+i+':1,'btn secondary')}</div></div><p>${esc(x.notes||'')}</p>${btn('Delete','delete-idea:'+x.id,'btn danger')}</div>`).join(''):empty('Save any little spark of inspiration here.')}</section>`}
function backup(){return `<section class="panel"><h2>💾 Protect your writing</h2><p>Your work is saved in this browser on this iPhone. Export a backup regularly and store it somewhere safe, such as Files or iCloud Drive.</p><div class="row"><button class="btn" data-action="backup">Export backup</button><button class="btn secondary" data-action="restore">Restore backup</button></div><input id="restoreFile" type="file" accept="application/json,.json" hidden><p class="tiny">A backup includes poems, stories, characters, chapters and ideas. Restoring replaces the current app data, so export a fresh backup first.</p></section>`}
function render(){renderNav();let out='';if(page==='Home')out=home();if(page==='Poetry')out=editing?.type==='poem'?poemForm(editing.item):poems();if(page==='Novels'){if(editing?.type==='story')out=storyForm(editing.item);else if(editing?.type==='character'){let s=data.stories.find(x=>x.id===editing.storyId);out=s?characterForm(s,editing.item):storyList()}else if(editing?.type==='chapter'){let s=data.stories.find(x=>x.id===editing.storyId);out=s?chapterForm(s,editing.item):storyList()}else{let s=data.stories.find(x=>x.id===selectedStory);out=s?storyDetail(s):storyList()}}if(page==='Ideas')out=ideas();if(page==='Backup')out=backup();$('#app').innerHTML=out;wire()}
function wire(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;editing=null;selectedStory=null;render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action));$('#app').querySelectorAll('[data-used]').forEach(c=>c.onchange=()=>{let x=data.ideas.find(x=>x.id===c.dataset.used);if(x){x.used=c.checked;save();render()}});$('#app').querySelectorAll('form').forEach(f=>f.onsubmit=e=>{e.preventDefault();handleForm(f)});let body=$('#chapterForm textarea[name="body"]');if(body)body.oninput=()=>$('#wordCount').textContent='Word count: '+body.value.trim().split(/\s+/).filter(Boolean).length}
function act(a){let [cmd,...rest]=a.split(':');if(cmd==='new-poem'){page='Poetry';editing={type:'poem',item:{}}}else if(cmd==='edit-poem'){editing={type:'poem',item:data.poems.find(x=>x.id===rest[0])}}else if(cmd==='delete-poem'){if(confirm('Delete this poem?')){data.poems=data.poems.filter(x=>x.id!==rest[0]);save()}}else if(cmd==='new-story'){page='Novels';editing={type:'story',item:{}}}else if(cmd==='edit-story'){editing={type:'story',item:data.stories.find(x=>x.id===rest[0])}}else if(cmd==='open-story'){selectedStory=rest[0];editing=null;page='Novels'}else if(cmd==='back-stories'){selectedStory=null;editing=null}else if(cmd==='new-character'){editing={type:'character',storyId:rest[0],item:{}}}else if(cmd==='edit-character'){editing={type:'character',storyId:rest[0],item:data.stories.find(s=>s.id===rest[0])?.characters.find(c=>c.id===rest[1])}}else if(cmd==='delete-character'){let s=data.stories.find(s=>s.id===rest[0]);if(s&&confirm('Delete this character?'))s.characters=s.characters.filter(c=>c.id!==rest[1]);save()}else if(cmd==='new-chapter'){editing={type:'chapter',storyId:rest[0],item:{}}}else if(cmd==='edit-chapter'){editing={type:'chapter',storyId:rest[0],item:data.stories.find(s=>s.id===rest[0])?.chapters.find(c=>c.id===rest[1])}}else if(cmd==='delete-idea'){data.ideas=data.ideas.filter(x=>x.id!==rest[0]);save()}else if(cmd==='move-idea'){let i=+rest[0],j=i+(+rest[1]);if(j>=0&&j<data.ideas.length){[data.ideas[i],data.ideas[j]]=[data.ideas[j],data.ideas[i]];save()}}else if(cmd==='cancel'){editing=null}else if(cmd==='backup'){download('my-creative-writing-backup.json',JSON.stringify(data,null,2),'application/json');return}else if(cmd==='restore'){ $('#restoreFile').click();return}else if(cmd==='export-story'){let s=data.stories.find(s=>s.id===rest[0]);if(s){let text=s.title+'\n\n'+s.summary+'\n\n'+s.chapters.map((c,i)=>`Chapter ${i+1}: ${c.title}\n\n${c.body||''}`).join('\n\n');download((s.title||'story').replace(/[^a-z0-9]+/gi,'-')+'.txt',text,'text/plain')}return}render()}
function handleForm(f){let v=Object.fromEntries(new FormData(f).entries());if(f.id==='poemForm'){let obj={id:v.id||id(),title:v.title,date:v.date,body:v.body};let i=data.poems.findIndex(x=>x.id===obj.id);i<0?data.poems.unshift(obj):data.poems[i]=obj;page='Poetry';editing=null}
if(f.id==='storyForm'){let obj={id:v.id||id(),title:v.title,summary:v.summary,started:v.started,completed:v.completed,characters:[],chapters:[]};let i=data.stories.findIndex(x=>x.id===obj.id);if(i<0)data.stories.unshift(obj);else{obj.characters=data.stories[i].characters;obj.chapters=data.stories[i].chapters;data.stories[i]=obj}selectedStory=obj.id;page='Novels';editing=null}
if(f.id==='characterForm'){let s=data.stories.find(x=>x.id===v.storyId);if(s){let obj={...v,id:v.id||id()};delete obj.storyId;let i=s.characters.findIndex(x=>x.id===obj.id);i<0?s.characters.push(obj):s.characters[i]=obj;selectedStory=s.id}editing=null}
if(f.id==='chapterForm'){let s=data.stories.find(x=>x.id===v.storyId);if(s){let obj={id:v.id||id(),title:v.title,summary:v.summary,body:v.body};let i=s.chapters.findIndex(x=>x.id===obj.id);i<0?s.chapters.push(obj):s.chapters[i]=obj;selectedStory=s.id}editing=null}
if(f.id==='ideaForm'){if(v.text.trim())data.ideas.unshift({id:id(),text:v.text.trim(),notes:v.notes,used:false});}
save();render()}
function download(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('change',e=>{if(e.target.id==='restoreFile'&&e.target.files[0]){let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||!Array.isArray(x.poems)||!Array.isArray(x.stories)||!Array.isArray(x.ideas))throw 0;if(confirm('Replace the current writing with this backup? Export a backup of current data first if needed.')){data=x;save();page='Home';render();alert('Backup restored.')}}catch(e){alert('That file does not look like a valid My Creative Writing backup.')}};r.readAsText(e.target.files[0]);e.target.value=''}});
render();
</script></body></html>
